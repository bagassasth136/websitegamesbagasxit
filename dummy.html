<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dummy APK Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{accent:'#A855F7'}}}}</script>
<style>body{-webkit-tap-highlight-color:transparent} .step-content{display:none} .step-content.active{display:block}</style>
</head>
<body class="bg-slate-50 dark:bg-[#050506] text-slate-900 dark:text-slate-100 font-sans min-h-screen pb-20">

<header class="sticky top-0 z-40 bg-white/80 dark:bg-[#0E0E12]/80 backdrop-blur-md border-b border-slate-200 dark:border-[#1C1C24] px-4 py-3 flex items-center justify-between">
<div class="font-black text-lg text-accent">Tambah Game/App</div>
<div class="text-xs font-bold text-slate-400">STEP <span id="stepNum">1</span>/3</div>
</header>

<main class="max-w-2xl mx-auto px-4 mt-4">
<form id="wizardForm">
<!-- STEP 1 -->
<div id="step1" class="step-content active space-y-4">
<h2 class="font-bold text-sm mb-2 border-l-4 border-accent pl-2">1. Info Dasar</h2>
<input type="text" placeholder="Game ID (Unik) - contoh: free-fire-max" class="w-full bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none focus:border-accent">
<input type="text" placeholder="Judul Game/App" class="w-full bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none focus:border-accent">
<input type="text" placeholder="Developer" class="w-full bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none focus:border-accent">
<div class="flex gap-2">
<select class="w-1/2 bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none">
<option>Tipe: Game</option>
<option>Tipe: App</option>
</select>
<input type="text" placeholder="Versi (v1.0.0)" class="w-1/2 bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none focus:border-accent">
</div>
</div>

<!-- STEP 2 -->
<div id="step2" class="step-content space-y-4">
<h2 class="font-bold text-sm mb-2 border-l-4 border-accent pl-2">2. Detail & Visual</h2>
<textarea placeholder="Deskripsi Game/App" class="w-full bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none focus:border-accent min-h-[80px]"></textarea>
<input type="text" placeholder="Yang Baru (Changelog)" class="w-full bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none focus:border-accent">
<div class="bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3">
<div class="text-xs font-bold mb-2">Pilih Kategori (bisa banyak)</div>
<div class="flex flex-wrap gap-2">
<span class="px-3 py-1.5 rounded-full border border-accent bg-accent/10 text-accent text-xs font-bold cursor-pointer">Aksi</span>
<span class="px-3 py-1.5 rounded-full border border-slate-300 dark:border-[#333] text-slate-500 text-xs font-bold cursor-pointer">Petualangan</span>
<span class="px-3 py-1.5 rounded-full border border-slate-300 dark:border-[#333] text-slate-500 text-xs font-bold cursor-pointer">Kasual</span>
<span class="px-3 py-1.5 rounded-full border border-slate-300 dark:border-[#333] text-slate-500 text-xs font-bold cursor-pointer">+ Tambah</span>
</div>
</div>
<div class="flex gap-2">
<input type="text" placeholder="Label (MOD)" class="w-1/2 bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none">
<input type="text" placeholder="Warna (#EF4444)" class="w-1/2 bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none">
</div>
<div class="bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 flex items-center justify-between cursor-pointer">
<span class="text-xs text-accent font-bold">Tap untuk upload Ikon</span>
<span class="text-xs text-slate-500">Belum ada</span>
</div>
</div>

<!-- STEP 3 -->
<div id="step3" class="step-content space-y-4">
<h2 class="font-bold text-sm mb-2 border-l-4 border-accent pl-2">3. Link & Keamanan</h2>
<input type="text" placeholder="Link APK (Download)" class="w-full bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none focus:border-accent">
<input type="text" placeholder="Custom Share URL (Opsional)" class="w-full bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none focus:border-accent">
<textarea placeholder="Info Keamanan Data" class="w-full bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] rounded-xl p-3 text-sm outline-none focus:border-accent min-h-[80px]"></textarea>

<div class="border-t border-slate-200 dark:border-[#1C1C24] pt-4 mt-4">
<h3 class="text-xs font-black text-accent uppercase mb-2">Media (Foto/Video)</h3>
<div class="flex items-center gap-2 bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] p-2 rounded-lg mb-2">
<span class="text-xs bg-accent text-white px-2 py-1 rounded">IMG</span>
<input type="text" value="https://github.com/.../img1.jpg" class="flex-1 bg-transparent text-xs outline-none">
<span class="text-xs font-bold text-slate-400">1</span>
<button class="text-red-500 text-xs font-bold">X</button>
</div>
<div class="flex items-center gap-2 bg-white dark:bg-[#0E0E12] border border-slate-200 dark:border-[#1C1C24] p-2 rounded-lg mb-2">
<span class="text-xs bg-blue-500 text-white px-2 py-1 rounded">VID</span>
<input type="text" value="https://youtube.com/..." class="flex-1 bg-transparent text-xs outline-none">
<span class="text-xs font-bold text-slate-400">2</span>
<button class="text-red-500 text-xs font-bold">X</button>
</div>
<button class="w-full py-2 rounded-lg border border-dashed border-slate-300 dark:border-[#333] text-xs font-bold text-slate-500">+ TAMBAH MEDIA</button>
</div>
</div>
</form>
</main>

<div class="fixed bottom-0 left-0 right-0 bg-white dark:bg-[#0E0E12] border-t border-slate-200 dark:border-[#1C1C24] p-4 flex gap-2 pb-[max(16px,env(safe-area-inset-bottom))]">
<button id="btnPrev" onclick="changeStep(-1)" class="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-[#1C1C24] text-sm font-bold disabled:opacity-50" disabled>Kembali</button>
<button id="btnNext" onclick="changeStep(1)" class="flex-1 py-3 rounded-xl bg-accent text-white text-sm font-bold shadow-lg">Lanjut</button>
</div>

<script>
let currentStep = 1;
function changeStep(dir) {
    document.getElementById('step'+currentStep).classList.remove('active');
    currentStep += dir;
    if (currentStep < 1) currentStep = 1;
    if (currentStep > 3) { alert('Simpan Data!'); currentStep = 3; }
    
    document.getElementById('step'+currentStep).classList.add('active');
    document.getElementById('stepNum').innerText = currentStep;
    
    document.getElementById('btnPrev').disabled = currentStep === 1;
    document.getElementById('btnNext').innerText = currentStep === 3 ? 'SIMPAN DATA' : 'Lanjut';
    window.scrollTo(0,0);
}
</script>
</body>
</html>
