      getBtn.style.display = "block";
      statusInfo.textContent = "✅ Verification complete. Click CONTINUE to proceed.";
    } else if (currentStep === 2) {
      turnstileBox.style.display = "none";
      statusInfo.textContent = "✅ Final verification complete!";
      handleGenerate();
    }
  }

  function init() {
    var params = new URLSearchParams(window.location.search);
    var versionParam = params.get('v');
    var isWaiting = localStorage.getItem(WAITING_KEY);
    var referrer = document.referrer.toLowerCase();
    var isFromShortlink = referrer.includes('move2link');
    var waitingValid = false;
    if (isWaiting) {
      var elapsed = Date.now() - parseInt(isWaiting);
      if (elapsed < 5 * 60 * 1000) waitingValid = true;
      else localStorage.removeItem(WAITING_KEY);
    }
    if (versionParam && (waitingValid || isFromShortlink)) {
      localStorage.removeItem(WAITING_KEY);
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      currentStep = 2;
      step1.className = 'step-dot done';
      step2.className = 'step-dot active';
      turnstileBox.style.display = "flex";
      getBtn.style.display = "none";
      statusInfo.textContent = "🔒 Complete the final security check to reveal your key.";
      if (window.turnstile && turnstileWidgetId !== null) {
        turnstile.reset(turnstileWidgetId);
      }
    } else {
      checkExistingKey();
    }
  }

  function checkExistingKey() {
    var savedKey = localStorage.getItem(USER_KEY_STORE);
    if (!savedKey) return;
    db.ref('keys/' + savedKey).once('value').then(function(snap) {
      var data = snap.val();
      if (data && data.expires_at > Date.now() && data.is_active) {
        currentKey = savedKey;
        showActiveKey(savedKey, data.expires_at);
      } else {
        localStorage.removeItem(USER_KEY_STORE);
      }
    });
  }

  getBtn.onclick = function() {
    var lastGen = localStorage.getItem(LAST_GEN_KEY);
    if (false && lastGen && (Date.now() - parseInt(lastGen)) < 5 * 3600 * 1000) {
      var sisaJam = Math.ceil((5 * 3600 * 1000 - (Date.now() - parseInt(lastGen))) / 3600000);
      statusInfo.textContent = "⚠️ Please wait " + sisaJam + " more hour(s) before generating a new key.";
      return;
    }
    localStorage.setItem(WAITING_KEY, Date.now().toString());
    var todayStr = new Date().toISOString().slice(0, 10);
    var usedHistory = JSON.parse(localStorage.getItem('used_links_history') || '{}');
    if (usedHistory.date !== todayStr) usedHistory = { date: todayStr, links: [] };
    var unusedLinks = SHORTLINK_URLS.filter(function(link) {
      return !usedHistory.links.includes(link);
    });
    var targetUrl;
    if (unusedLinks.length > 0) {
      targetUrl = unusedLinks[Math.floor(Math.random() * unusedLinks.length)];
    } else {
      usedHistory.links = [];
      targetUrl = SHORTLINK_URLS[Math.floor(Math.random() * SHORTLINK_URLS.length)];
    }
    usedHistory.links.push(targetUrl);
    localStorage.setItem('used_links_history', JSON.stringify(usedHistory));
    statusInfo.textContent = "🔗 Redirecting to verification...";
    setTimeout(function() { window.location.href = targetUrl; }, 500);
  };

  function handleGenerate() {
    statusInfo.textContent = "⚙️ Generating your key...";
    var randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
    var newKey = "BX-" + randomCode;
    var now = Date.now();
    var durationMs = DURATION_HOURS * 3600 * 1000;
    var payload = {
      key: newKey, created_at: firebase.database.ServerValue.TIMESTAMP,
      expires_at: now + durationMs, duration_ms: durationMs, is_active: true,
      hwid: "", assigned_to: "Auto-Gen", source: "web", reset_count: 0, last_reset: 0
    };
    function writeKey() {
      db.ref('keys/' + newKey).set(payload).then(function() {
        localStorage.setItem(USER_KEY_STORE, newKey);
        localStorage.setItem(LAST_GEN_KEY, now.toString());
        currentKey = newKey;
        showActiveKey(newKey, now + durationMs);
      }).catch(function(err) {
        statusInfo.textContent = "❌ Error: " + err.message;
        showToast('❌ ' + err.message, true);
      });
    }
    if (auth.currentUser) writeKey();
    else auth.signInAnonymously().then(writeKey).catch(function(err) {
      statusInfo.textContent = "❌ Auth error: " + err.message;
    });
  }

  // ===== TYPING EFFECT =====
  function typeKey(fullKey, callback) {
    var i = 0;
    keyDisplay.classList.remove('locked');
    keyDisplay.innerHTML = '';
    var textSpan = document.createElement('span');
    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    keyDisplay.appendChild(textSpan);
    keyDisplay.appendChild(cursor);

    var intv = setInterval(function() {
      i++;
      textSpan.textContent = fullKey.substring(0, i);
      if (i >= fullKey.length) {
        clearInterval(intv);
        setTimeout(function() { cursor.remove(); if (callback) callback(); }, 400);
      }
    }, 70);
  }

  function showActiveKey(key, expiresAt) {
    statusInfo.textContent = "✅ Key active. Copy and paste it into BAGASXIT app.";
    turnstileBox.style.display = "none";
    getBtn.style.display = "none";
    copyBtn.style.display = "block";
    keyBox.classList.add('active');
    step2.className = 'step-dot done';

    // Typing + shine
    typeKey(key, function() {
      navigator.clipboard.writeText(key).then(function() {
        showToast('✅ Key copied to clipboard');
      }).catch(function() {});
    });

    // Re-trigger shine
    shine.style.animation = 'none';
    setTimeout(function() { shine.style.animation = 'shineMove 2.4s ease-out 1'; }, 20);

    // Timer countdown + progress ring
    timerWrap.classList.add('show');
    keyTimer.textContent = "Key aktif";

    if (countdownInterval) clearInterval(countdownInterval);
    var totalMs = expiresAt - Date.now();

    function tick() {
      var ms = expiresAt - Date.now();
      if (ms <= 0) {
        timerText.textContent = 'EXPIRED';
        timerRing.style.strokeDashoffset = RING_CIRCUM;
        clearInterval(countdownInterval);
        return;
      }
      var h = Math.floor(ms / 3600000);
      var m = Math.floor((ms % 3600000) / 60000);
      var s = Math.floor((ms % 60000) / 1000);
      timerText.textContent = (h > 0 ? h + 'h ' : '') + (m < 10 ? '0' + m : m) + 'm';
      var ratio = ms / totalMs;
      timerRing.style.strokeDashoffset = RING_CIRCUM * (1 - ratio);
    }
    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  copyBtn.onclick = function() {
    navigator.clipboard.writeText(keyDisplay.textContent.replace(/[^A-Z0-9-]/g, '')).then(function() {
      showToast('✅ Key copied');
      copyBtn.textContent = "✅ COPIED!";
      setTimeout(function() { copyBtn.textContent = "📋 COPY KEY"; }, 2000);
    });
  };

  init();
</script>
</body>
</html>
