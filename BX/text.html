<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAGASXIT ADMIN PANEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { bg: '#0A0A0F', panel: '#141419', card: '#14141C', input: '#0F0B21', primary: '#A78BFA', primaryHover: '#8B5CF6', border: '#262630', textMain: '#F8FAFC', textMuted: '#94A3B8', textDark: '#64748B', danger: '#EF4444', success: '#22C55E', warning: '#F59E0B' }, borderRadius: { capsule: '50px', card: '14px', btn: '10px' } } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #14141C; }
        ::-webkit-scrollbar-thumb { background: #262630; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #A78BFA; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-bg text-textMain font-sans h-screen flex overflow-hidden antialiased">

    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-20 hidden transition-opacity" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="fixed md:relative z-30 w-[260px] h-full bg-panel border-r border-border flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="p-5 border-b border-border">
            <h1 class="text-xl font-bold text-primary tracking-wide">BAGASXIT</h1>
            <p class="text-[10px] text-textDark uppercase tracking-widest mt-1">Admin Panel</p>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1" id="sidebarMenu"></ul>
        </nav>
        <div class="p-4 border-t border-border text-center"><p class="text-[10px] text-textDark">BAGASXIT v2.0</p></div>
    </aside>

    <main class="flex-1 flex flex-col h-full w-full min-w-0 bg-bg relative">
        <header class="bg-panel px-4 py-3 flex items-center justify-between border-b border-border shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-primary text-2xl focus:outline-none hover:text-primaryHover">☰</button>
                <div>
                    <h2 class="font-bold text-sm tracking-wider text-textMain">BAGASXIT</h2>
                    <p class="text-[9px] text-textDark uppercase tracking-widest">Admin Panel</p>
                </div>
            </div>
            <div class="text-right text-[10px] sm:text-xs">
                <p class="text-textMain font-medium">🔑 Keys: <span id="statKeys">0</span></p>
                <p class="text-success font-bold mt-0.5">🟢 Online: <span id="statOnline">0</span></p>
            </div>
        </header>
        <div class="bg-panel px-3 pb-2 shrink-0 overflow-x-auto no-scrollbar border-b border-border/50">
            <div id="subTabContainer" class="flex space-x-1.5 pt-1"></div>
        </div>
        <div id="contentFrame" class="flex-1 overflow-y-auto p-4 relative"></div>
    </main>

    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // --- CORE API & UTILS ---
        const SB_URL = "https://qlzwqbbvjscfjaicbhks.supabase.co";
        const SB_ANON = "sb_publishable_DRIOqI7O90TinECl4K6FJA_l0nIaPCY";
        const ADMIN_PASS = "BAGASXIT 2006";
        const ADMIN_API = SB_URL + "/functions/v1/admin-api";

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `px-4 py-3 rounded-card text-sm font-bold shadow-lg border transition-all duration-300 pointer-events-auto ${type === 'error' ? 'bg-card border-danger text-danger' : type === 'success' ? 'bg-card border-success text-success' : 'bg-card border-primary text-primary'}`;
            t.innerText = msg; c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        function parseIso(iso) {
            if (!iso || iso === "null") return 0;
            try { let c = iso.trim(); if (c.includes(".")) c = c.substring(0, c.indexOf(".")); if (c.endsWith("Z")) c = c.slice(0, -1); if (c.includes("+")) c = c.substring(0, c.indexOf("+")); return new Date(c + "Z").getTime(); } catch (e) { return 0; }
        }

        async function callAdmin(payload) {
            payload.pass = ADMIN_PASS;
            const res = await fetch(ADMIN_API, { method: 'POST', headers: { 'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}`, 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const json = await res.json();
            if (!json.ok) throw new Error(json.error || "API Error");
            return json;
        }

        async function callRest(endpoint, method = 'GET', body = null, admin = false) {
            const headers = { 'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}`, 'Content-Type': 'application/json' };
            if (admin) headers['x-admin-key'] = ADMIN_PASS;
            if (method !== 'GET' && method !== 'DELETE') headers['Prefer'] = 'return=representation';
            const res = await fetch(`${SB_URL}/rest/v1/${endpoint}`, { method, headers, body: body ? JSON.stringify(body) : null });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        // --- ROUTER & STATE ---
        const MENUS = [
            { id: 'dash', name: 'Dashboard', icon: '🏠', tabs: ['Overview'] },
            { id: 'web', name: 'Web Utama', icon: '🌐', tabs: ['List Game', 'Kategori', 'Ulasan', 'Web Settings'] },
            { id: 'key', name: 'Key System', icon: '🔑', tabs: ['Generate', 'List Key', 'List Multi'] },
            { id: 'store', name: 'Store', icon: '🛒', tabs: ['Katalog'] },
            { id: 'apk', name: 'APK File', icon: '📱', tabs: ['Update APK', 'Komentar', 'Kategori', 'Filter'] },
            { id: 'system', name: 'System', icon: '⚙️', tabs: ['Broadcast', 'Logs', 'Suspect', 'Links', 'Monitor', 'Security'] }
        ];

        let currentMenu = 0;
        let currentSubTab = 0;

        function initSidebar() {
            document.getElementById('sidebarMenu').innerHTML = MENUS.map((m, i) => `<li><button onclick="openMenu(${i})" class="nav-btn w-full flex items-center px-5 py-3 text-sm text-textMain hover:bg-card transition-colors border-l-2 border-transparent"><span class="mr-3 text-lg">${m.icon}</span> ${m.name}</button></li>`).join('');
        }

        function toggleSidebar() {
            const s = document.getElementById('sidebar'), o = document.getElementById('sidebarOverlay');
            s.classList.toggle('-translate-x-full'); o.classList.toggle('hidden');
        }

        function openMenu(idx) {
            currentMenu = idx; currentSubTab = 0;
            if (window.innerWidth < 768) toggleSidebar();
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.toggle('bg-card', i === idx); btn.classList.toggle('text-primary', i === idx);
                btn.classList.toggle('border-primary', i === idx); btn.classList.toggle('border-transparent', i !== idx);
            });
            renderSubTabs(); routeContent(); loadStats();
        }

        function renderSubTabs() {
            document.getElementById('subTabContainer').innerHTML = MENUS[currentMenu].tabs.map((tab, i) => `<button onclick="currentSubTab=${i}; renderSubTabs(); routeContent();" class="whitespace-nowrap px-4 py-1.5 text-xs font-bold rounded-btn transition-colors ${i === currentSubTab ? 'bg-primary text-bg' : 'bg-transparent text-textMuted hover:text-textMain'}">${tab}</button>`).join('');
        }

        function routeContent() {
            const f = document.getElementById('contentFrame');
            f.innerHTML = '<div class="flex justify-center py-20 text-primary animate-pulse font-bold tracking-widest text-sm">LOADING MODULE...</div>';
            if (currentMenu === 0) loadDashboard(f);
            else if (currentMenu === 1) loadKeysSystem(f, currentSubTab);
            else if (currentMenu === 2) loadStore(f);
            else if (currentMenu === 3) loadApkSystem(f, currentSubTab);
else if (currentMenu === 4) loadSysSystem(f, currentSubTab);
else if (currentMenu === 5) loadWebSystem(f, currentSubTab);
        }

        // --- MODUL: DASHBOARD ---
        async function loadStats() {
            try { const k = await callAdmin({ action: "list-keys" }); document.getElementById('statKeys').innerText = k.data?.length || 0; } catch (e) {}
            try { const o = await callAdmin({ action: "live-users" }); const now = Date.now(); let a = 0; o.data?.forEach(x => { if (x.last_seen && (now - x.last_seen) <= 120000) a++; }); document.getElementById('statOnline').innerText = a; } catch (e) {}
        }

        async function loadDashboard(f) {
            f.innerHTML = `<div class="space-y-4"><div class="grid grid-cols-2 gap-4"><div class="bg-card p-4 rounded-card border border-border"><p class="text-[9px] text-textDark font-bold">TOTAL KEYS</p><p id="dTotal" class="text-2xl font-bold">-</p></div><div class="bg-card p-4 rounded-card border border-border"><p class="text-[9px] text-textDark font-bold">LIVE USERS</p><p id="dOnline" class="text-2xl font-bold text-success">-</p></div></div><div class="bg-card p-4 rounded-card border border-border space-y-2"><p class="text-[10px] font-bold text-primary">STATISTIK KEY</p><p id="dAct" class="text-xs">✅ Active: -</p><p id="dExp" class="text-xs text-danger">❌ Expired: -</p><p id="dBnd" class="text-xs text-warning">🟡 Bound: -</p></div><div class="bg-card p-4 rounded-card border border-border"><p class="text-[10px] font-bold text-primary mb-2">RECENT ACTIVITY</p><div id="dLog" class="text-[11px] text-textMuted space-y-1"></div></div></div>`;
            try {
                const k = await callAdmin({ action: "list-keys" }); const keys = k.data || []; const now = Date.now(); let a = 0, e = 0, b = 0;
                keys.forEach(o => { const exp = parseIso(o.expires_at); const h = o.hwid || ""; const act = o.is_active; const isB = h.length > 0; const isE = exp > 0 && now > exp; if (act && !isE) a++; if (isE) e++; if (isB) b++; });
                document.getElementById('dTotal').innerText = keys.length; document.getElementById('dAct').innerText = `✅ Active: ${a}`; document.getElementById('dExp').innerText = `❌ Expired: ${e}`; document.getElementById('dBnd').innerText = `🟡 Bound: ${b}`;
            } catch (e) {}
            try { const l = await callAdmin({ action: "list-logs" }); const logs = (l.data || []).slice(0, 5); document.getElementById('dLog').innerHTML = logs.length ? logs.map(o => `<p>• ${o.action}</p>`).join('') : '<p class="text-textDark">Belum ada aktivitas</p>'; } catch (e) {}
        }

        // --- MODUL: KEY SYSTEM ---
        let cachedKeys = [], currentFilter = "all", currentSearch = "", renderOffset = 0;
        const RENDER_STEP = 50;

        function loadKeysSystem(f, subTab) {
            if (subTab === 0) {
                f.innerHTML = `<div class="bg-card p-4 rounded-card border border-border max-w-lg mx-auto"><input id="genKey" placeholder="Key Code (e.g. BX-ABC123)" class="w-full bg-input border border-border rounded-btn p-3 text-sm mb-2"><button onclick="document.getElementById('genKey').value='BX-'+Math.random().toString(36).substring(2,8).toUpperCase()" class="w-full bg-primary text-bg font-bold text-xs py-2 rounded-btn mb-2">⚡ AUTO GENERATE</button><input id="genDur" type="number" placeholder="Duration (hours)" class="w-full bg-input border border-border rounded-btn p-3 text-sm mb-2"><div class="grid grid-cols-4 gap-2 mb-4">${[24, 72, 168, 720].map(h => `<button onclick="document.getElementById('genDur').value='${h}'" class="bg-primary text-bg font-bold text-xs py-2 rounded-btn">${h/24}D</button>`).join('')}</div><button onclick="submitGenKey()" class="w-full bg-primary text-bg font-bold text-sm py-3 rounded-btn">+ CREATE & SAVE KEY</button></div>`;
            } else if (subTab === 1) {
                f.innerHTML = `<div class="space-y-4"><input id="searchKey" oninput="currentSearch=this.value.toLowerCase(); renderOffset=0; renderKeys();" placeholder="🔍 Search key..." class="w-full bg-input border border-border rounded-btn p-3 text-sm"><div class="grid grid-cols-4 gap-2">${['all', 'active', 'expired', 'bound'].map(t => `<button onclick="setKeyFilter('${t}')" id="f-${t}" class="bg-input text-textMuted font-bold text-[10px] py-2 rounded-btn border border-border">${t.toUpperCase()}</button>`).join('')}</div><button onclick="deleteFilteredKeys()" id="btnDelFiltered" class="w-full bg-danger text-white font-bold text-xs py-3 rounded-btn">⚠ DELETE ALL</button><div id="keysContainer" class="space-y-3"></div></div>`;
                setKeyFilter('all'); fetchKeys();
            } else if (subTab === 2) {
                f.innerHTML = `<div class="bg-card p-4 rounded-card border border-border max-w-lg mx-auto"><input id="mKey" placeholder="Multi Key Code" class="w-full bg-input border border-border rounded-btn p-3 text-sm mb-2"><button onclick="document.getElementById('mKey').value='BX-MULTI-'+Math.random().toString(36).substring(2,8).toUpperCase()" class="w-full bg-primary text-bg font-bold text-xs py-2 rounded-btn mb-2">⚡ AUTO GENERATE</button><input id="mDur" type="number" placeholder="Duration (hours)" class="w-full bg-input border border-border rounded-btn p-3 text-sm mb-2"><div class="grid grid-cols-4 gap-2 mb-2">${[24, 72, 168, 720].map(h => `<button onclick="document.getElementById('mDur').value='${h}'" class="bg-primary text-bg font-bold text-xs py-2 rounded-btn">${h/24}D</button>`).join('')}</div><p class="text-[10px] text-textMuted mt-2 mb-1">Max Devices</p><div class="grid grid-cols-4 gap-2 mb-2">${[5, 50, 100, 1000].map(n => `<button onclick="setMaxDev(${n},this)" class="dev-btn bg-input border border-border text-textMain font-bold text-[10px] py-2 rounded-btn">${n}</button>`).join('')}</div><div class="grid grid-cols-3 gap-2 mb-4"><button onclick="setMaxDev(0,this)" class="dev-btn bg-input border border-border text-textMain font-bold text-[10px] py-2 rounded-btn col-span-1">♾ UNLIMITED</button><input id="mCustomDev" type="number" placeholder="Custom" class="col-span-2 bg-input border border-border rounded-btn p-2 text-sm"><input type="hidden" id="mMaxDev" value="5"></div><p id="mDevLabel" class="text-center text-primary font-bold text-[10px] mb-3">Selected: 5 devices</p><button onclick="submitMultiKey()" class="w-full bg-primary text-bg font-bold text-sm py-3 rounded-btn">+ CREATE MULTI KEY</button></div><div id="multiContainer" class="space-y-3 mt-4"></div>`;
                fetchMultiKeys();
            }
        }

        async function submitGenKey() {
            const k = document.getElementById('genKey').value.trim(), d = document.getElementById('genDur').value.trim();
            if (!k || !d) return showToast("Isi key dan durasi!", "error");
            try { await callAdmin({ action: "create-key", key: k, duration_ms: parseInt(d) * 3600000, max_devices: 1, assigned_to: "Admin-Panel" }); showToast("Key dibuat", "success"); callAdmin({ action: "add-log", log: `Created key: ${k}` }); document.getElementById('genKey').value = ''; document.getElementById('genDur').value = ''; loadStats(); } catch (e) { showToast(e.message, "error"); }
        }

        async function fetchKeys() { try { const r = await callAdmin({ action: "list-keys" }); cachedKeys = r.data || []; renderKeys(); } catch (e) { showToast("Gagal load keys", "error"); } }

        function setKeyFilter(f) {
            currentFilter = f; renderOffset = 0;
            ['all', 'active', 'expired', 'bound'].forEach(t => { const b = document.getElementById(`f-${t}`); if (!b) return; b.className = t === f ? "bg-primary text-bg font-bold text-[10px] py-2 rounded-btn" : "bg-input text-textMuted font-bold text-[10px] py-2 rounded-btn border border-border"; });
            const btn = document.getElementById('btnDelFiltered'); if (btn) btn.innerText = `⚠ DELETE ${f.toUpperCase()}`;
            renderKeys();
        }

        function renderKeys() {
            const c = document.getElementById('keysContainer'); if (!c) return; c.innerHTML = '';
            const now = Date.now(); let mc = 0, rd = 0;
            cachedKeys.forEach(o => {
                const kn = o.key || "", exp = parseIso(o.expires_at), hw = o.hwid || "", act = o.is_active, md = o.max_devices || 1;
                const bnd = hw.length > 0, expd = exp > 0 && now > exp;
                if (md > 1 || md === 0) return;
                if (currentFilter === 'active' && (expd || !act)) return;
                if (currentFilter === 'expired' && !expd) return;
                if (currentFilter === 'bound' && !bnd) return;
                if (currentSearch && !kn.toLowerCase().includes(currentSearch)) return;
                if (mc >= renderOffset && mc < renderOffset + RENDER_STEP) { c.innerHTML += cardKey(o, kn, exp, hw, bnd, md); rd++; }
                mc++;
            });
            if (mc === 0) c.innerHTML = '<p class="text-center text-textDark text-xs py-10">Tidak ada key</p>';
            else {
                if (renderOffset + RENDER_STEP < mc) c.innerHTML += `<button onclick="renderOffset+=${RENDER_STEP}; renderKeys();" class="w-full bg-primary/20 text-primary border border-primary font-bold text-xs py-3 rounded-btn mt-2">LOAD MORE (${mc - (renderOffset + RENDER_STEP)} left)</button>`;
                c.innerHTML += `<p class="text-center text-textDark text-[10px] py-2">Showing ${rd} of ${mc} keys</p>`;
            }
        }

        function cardKey(o, key, exp, hwid, bound, maxDev) {
            const isM = maxDev > 1 || maxDev === 0, hl = o.hwid_list || [], conn = isM ? hl.length : (bound ? 1 : 0);
            const title = isM ? `${key} · ${conn}/${maxDev === 0 ? '∞' : maxDev}` : `${bound ? 'BOUND' : 'FREE'} · ${key}`;
            const expStr = exp > 0 ? new Date(exp).toLocaleString() : '-';
            const rem = exp - Date.now(), remStr = rem > 0 ? `${Math.floor(rem/3600000)}h left` : 'expired';
            return `<div class="bg-card border ${isM ? 'border-primary' : 'border-border'} p-4 rounded-card"><p class="font-bold text-sm mb-1">${title}</p>${exp > 0 ? `<p class="text-[10px] text-textMuted mb-3">${expStr} · ${remStr}</p>` : ''}<div class="grid grid-cols-2 gap-2 mb-2"><button onclick="navigator.clipboard.writeText('${key}');showToast('Copied','success')" class="bg-primary/10 text-primary border border-primary font-bold text-[10px] py-2 rounded-btn">COPY KEY</button>${isM ? `<button onclick="showDevList('${key}',${JSON.stringify(hl).replace(/"/g,'&quot;')},${maxDev})" class="bg-success/10 text-success border border-success font-bold text-[10px] py-2 rounded-btn">DEVICES</button>` : `<button onclick="navigator.clipboard.writeText('${hwid}');showToast('HWID Copied','success')" class="bg-success/10 text-success border border-success font-bold text-[10px] py-2 rounded-btn">COPY HWID</button>`}</div><div class="grid grid-cols-2 gap-2"><button onclick="resetKey('${key}',${isM})" class="bg-warning/10 text-warning border border-warning font-bold text-[10px] py-2 rounded-btn">RESET</button><button onclick="delKey('${key}')" class="bg-danger/10 text-danger border border-danger font-bold text-[10px] py-2 rounded-btn">DELETE</button></div></div>`;
        }

        async function resetKey(k, isM) { if (!confirm('Reset?')) return; try { await callAdmin({ action: isM ? "reset-all-devices" : "reset-hwid", key: k }); showToast("Reset OK", "success"); fetchKeys(); } catch (e) { showToast(e.message, "error"); } }
        async function delKey(k) { if (!confirm('Hapus?')) return; try { await callAdmin({ action: "delete-key", key: k }); showToast("Terhapus", "success"); fetchKeys(); loadStats(); } catch (e) { showToast(e.message, "error"); } }
        function showDevList(k, hl, md) { let h = `<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onclick="this.remove()"><div class="bg-card p-5 rounded-card w-full max-w-md" onclick="event.stopPropagation()"><h3 class="text-primary font-bold text-center mb-4">${hl.length}/${md === 0 ? '∞' : md} DEVICES</h3>`; if (!hl.length) h += `<p class="text-center text-textDark text-xs py-4">Kosong</p>`; else hl.forEach(x => h += `<div class="flex justify-between bg-input p-2 rounded mb-2"><span class="text-xs truncate">${x}</span><button onclick="rmDev('${k}','${x}')" class="bg-danger/20 text-danger text-[10px] px-2 py-1 rounded">RM</button></div>`); h += `<button onclick="this.closest('.fixed').remove()" class="w-full bg-primary text-bg font-bold text-xs py-2 rounded-btn mt-4">TUTUP</button></div></div>`; document.body.insertAdjacentHTML('beforeend', h); }
        async function rmDev(k, h) { try { await callAdmin({ action: "remove-device", key: k, hwid: h }); showToast("Removed", "success"); document.querySelector('.fixed.inset-0')?.remove(); fetchKeys(); } catch (e) { showToast(e.message, "error"); } }

        async function deleteFilteredKeys() {
            if (!confirm(`Hapus filter ${currentFilter}?`)) return;
            const now = Date.now(), del = [];
            cachedKeys.forEach(o => { const kn = o.key, exp = parseIso(o.expires_at), h = o.hwid || "", a = o.is_active, b = h.length > 0, e = exp > 0 && now > exp; let d = false; if (currentFilter === 'all') d = true; else if (currentFilter === 'active') d = (a && !e); else if (currentFilter === 'expired') d = e; else if (currentFilter === 'bound') d = b; if (d && kn) del.push(kn); });
            if (!del.length) return showToast("Kosong", "error");
            try { await callAdmin({ action: "delete-keys-batch", keys: del }); showToast(`${del.length} hapus`, "success"); fetchKeys(); loadStats(); } catch (e) { showToast(e.message, "error"); }
        }

        function setMaxDev(v, btn) { document.getElementById('mMaxDev').value = v; document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('border-primary')); btn.classList.add('border-primary'); document.getElementById('mDevLabel').innerText = `Selected: ${v === 0 ? 'UNLIMITED' : v + ' devices'}`; }
        async function submitMultiKey() {
            const k = document.getElementById('mKey').value.trim(), d = document.getElementById('mDur').value.trim(), md = parseInt(document.getElementById('mMaxDev').value);
            if (!k || !d) return showToast("Isi key & durasi!", "error");
            try { await callAdmin({ action: "create-key", key: k, duration_ms: parseInt(d) * 3600000, max_devices: md, assigned_to: "Admin-Multi" }); showToast("Multi Key dibuat", "success"); fetchMultiKeys(); loadStats(); } catch (e) { showToast(e.message, "error"); }
        }
        async function fetchMultiKeys() { try { const r = await callAdmin({ action: "list-keys" }); const c = document.getElementById('multiContainer'); if (!c) return; c.innerHTML = ''; const multi = r.data?.filter(o => o.max_devices > 1 || o.max_devices === 0) || []; if (!multi.length) c.innerHTML = '<p class="text-center text-textDark text-xs py-10">Belum ada multi key</p>'; else multi.forEach(o => c.innerHTML += cardKey(o, o.key, parseIso(o.expires_at), o.hwid || "", false, o.max_devices)); } catch (e) {} }

        // --- MODUL: STORE ---
        async function loadStore(f) {
            f.innerHTML = `<div class="space-y-4"><button onclick="showStoreDialog()" class="w-full bg-primary text-bg font-bold text-sm py-3 rounded-btn">+ TAMBAH PRODUK</button><div id="storeContainer" class="space-y-3"></div></div>`;
            try {
                const r = await callAdmin({ action: "list-store" }); const c = document.getElementById('storeContainer'); const data = r.data || [];
                if (!data.length) c.innerHTML = '<p class="text-center text-textDark text-xs py-10">Belum ada produk</p>';

let cachedSuspect = [], cachedBlocked = [], suspectFilter = 'all';
function filterSuspect(f) { suspectFilter = f; document.getElementById('sAll').className = f === 'all' ? 'bg-primary text-bg font-bold text-xs py-2 rounded-btn' : 'bg-input border border-border text-textMuted font-bold text-xs py-2 rounded-btn'; document.getElementById('sBlocked').className = f === 'blocked' ? 'bg-primary text-bg font-bold text-xs py-2 rounded-btn' : 'bg-input border border-border text-textMuted font-bold text-xs py-2 rounded-btn'; renderSuspect(); }
async function fetchSuspect() { try { const s = await callAdmin({ action: "list-suspect" }); const b = await callAdmin({ action: "list-blocked" }); cachedSuspect = s.data || []; cachedBlocked = b.data || []; renderSuspect(); } catch (e) {} }
function renderSuspect() {
    const c = document.getElementById('suspectContainer'); if (!c) return; c.innerHTML = '';
    const q = document.getElementById('sSearch').value.toLowerCase();
    const blockedFps = cachedBlocked.map(b => b.fp);
    let count = 0;
    cachedSuspect.forEach(o => {
        const fp = o.fp || "", isBlocked = blockedFps.includes(fp);
        if (suspectFilter === 'blocked' && !isBlocked) return;
        if (q && !fp.toLowerCase().includes(q)) return;
        if (count >= 200) return; count++;
        c.innerHTML += `<div class="bg-card border ${isBlocked ? 'border-danger' : 'border-border'} p-3 rounded-card"><p class="text-xs font-bold ${isBlocked ? 'text-danger' : 'text-warning'}">${fp.substring(0, 20)}</p><p class="text-[9px] text-textMuted mt-1">Reason: ${o.reason || 'unknown'} · IP: ${o.ip || '-'}</p><div class="grid grid-cols-2 gap-2 mt-2"><button onclick="navigator.clipboard.writeText('${fp}');showToast('Copied','success')" class="bg-primary/10 text-primary border border-primary text-[10px] font-bold py-1 rounded-btn">COPY FP</button><button onclick="${isBlocked ? `unblockFp('${fp}')` : `blockFpManual('${fp}')`}" class="bg-${isBlocked ? 'success' : 'danger'}/10 text-${isBlocked ? 'success' : 'danger'} border border-${isBlocked ? 'success' : 'danger'} text-[10px] font-bold py-1 rounded-btn">${isBlocked ? 'UNBLOCK' : 'BLOCK'}</button></div></div>`;
    });
    if (!count) c.innerHTML = '<p class="text-textDark text-xs text-center py-10">Tidak ada suspect</p>';
}

    } catch (e) {}
}

async function bulkImport() {
    const t = document.getElementById('bulkLinks').value.trim(), lines = t.split('\n'), uniq = new Set(), arr = [];
    lines.forEach(l => { const c = l.trim(); if (c.startsWith('http') && !uniq.has(c)) { uniq.add(c); arr.push(c); } });
    if (!arr.length) return showToast("Kosong", "error");
    try { await callAdmin({ action: "bulk-add-links", urls: arr }); document.querySelector('.fixed.inset-0').remove(); fetchLinks(); } catch (e) { showToast(e.message, "error"); }
}

async function fetchGames() {
    const c = document.getElementById('gamesContainer'); if (!c) return;
    try { const r = await callRest("games?select=*&order=created_at.desc"); if (!r.length) return c.innerHTML = '<p class="text-center text-textDark text-xs py-10">Belum ada game</p>'; c.innerHTML = r.map(o => `<div class="bg-card border border-primary p-4 rounded-card"><p class="font-bold text-sm">${o.title}</p><p class="text-[9px] text-textMuted">${o.developer} · ${o.category} · ${o.game_id}</p><div class="grid grid-cols-2 gap-2 mt-3"><button onclick='showGameForm(${JSON.stringify(o).replace(/'/g, "&#39;")})' class="bg-warning/10 text-warning border border-warning text-[10px] font-bold py-2 rounded-btn">EDIT</button><button onclick="delGame('${o.game_id}')" class="bg-danger/10 text-danger border border-danger text-[10px] font-bold py-2 rounded-btn">DELETE</button></div></div>`).join(''); } catch (e) { showToast("Gagal load game", "error"); }
}

async function saveGame(id) {
    const data = { game_id: document.getElementById('gId').value, title: document.getElementById('gTitle').value, developer: document.getElementById('gDev').value, app_type: document.getElementById('gType').value, version: document.getElementById('gVer').value, changelog: document.getElementById('gCh').value, desc_game: document.getElementById('gDesc').value, category: document.getElementById('gCat').value, label_text: document.getElementById('gLabel').value, label_color: document.getElementById('gLabelColor').value, badge_text: document.getElementById('gBadge').value, is_carousel: document.getElementById('gCarousel').checked, is_featured: document.getElementById('gFeatured').checked, security_info: document.getElementById('gSec').value, apk_url: document.getElementById('gApk').value, share_url: document.getElementById('gShare').value, is_active: true };
    if (!data.game_id || !data.title) return showToast("ID & Judul wajib", "error");
    try { if (id) await callRest(`games?game_id=eq.${id}`, 'PATCH', data, true); else await callRest(`games`, 'POST', data, true); showToast("Tersimpan", "success"); document.querySelector('.fixed.inset-0').remove(); fetchGames(); } catch (e) { showToast(e.message, "error"); }
}
async function delGame(id) { if (!confirm("Hapus?")) return; try { await callRest(`games?game_id=eq.${id}`, 'DELETE', null, true); fetchGames(); } catch (e) { showToast(e.message, "error"); } }

async function fetchGameCategories() {
    const c = document.getElementById('gameCatContainer'); if (!c) return;
    try { const r = await callRest("game_categories?select=*&order=name.asc"); c.innerHTML = r.map(o => `<div class="flex justify-between bg-card border border-border p-3 rounded-card"><span class="text-sm">${o.name}</span><button onclick="delGameCategory('${o.id}')" class="text-danger text-[10px] font-bold">DELETE</button></div>`).join(''); } catch (e) {}
}
async function addGameCategory() { const n = document.getElementById('newGameCat').value.trim().toUpperCase(); if (!n) return; try { await callRest("game_categories", 'POST', { name: n }, true); document.getElementById('newGameCat').value = ''; fetchGameCategories(); } catch (e) { showToast(e.message, "error"); } }
async function delGameCategory(id) { try { await callRest(`game_categories?id=eq.${id}`, 'DELETE', null, true); fetchGameCategories(); } catch (e) {} }

async function loadGameReviews() {
    const gid = document.getElementById('gidSearch').value.trim(); if (!gid) return showToast("Masukkan Game ID", "error");
    const c = document.getElementById('reviewsContainer'); c.innerHTML = '<p class="text-primary animate-pulse text-xs">Loading...</p>';
    try { const r = await callRest(`game_reviews?game_id=eq.${gid}&order=created_at.desc`); if (!r.length) return c.innerHTML = '<p class="text-textDark text-xs py-4">Belum ada ulasan</p>'; c.innerHTML = r.map(o => `<div class="bg-card border border-border p-3 rounded-card"><p class="text-primary font-bold text-xs">${o.name} • ${o.rating}★</p><p class="text-textMain text-[11px] mt-1 mb-2">${o.review_text}</p><button onclick="delReview('${o.id}')" class="bg-danger/10 text-danger border border-danger text-[10px] font-bold px-3 py-1 rounded-btn">HAPUS</button></div>`).join(''); } catch (e) { showToast(e.message, "error"); }
}
async function delReview(id) { try { await callRest(`game_reviews?id=eq.${id}`, 'DELETE', null, true); loadGameReviews(); } catch (e) {} }

function setupWsTabs() {
    const tabs = ['Info', 'Welcome', 'Sosmed', 'Section'], pages = ['wsPageInfo', 'wsPageWelcome', 'wsPageSosmed', 'wsPageSection'], c = document.getElementById('wsTabs');
    c.innerHTML = tabs.map((t, i) => `<button onclick="switchWsTab(${i})" class="ws-tab whitespace-nowrap px-4 py-1.5 text-xs font-bold rounded-btn transition-colors ${i===0?'bg-primary text-bg':'bg-input text-textMuted border border-border'}" data-idx="${i}">${t}</button>`).join('');
}
function switchWsTab(idx) {
    document.querySelectorAll('.ws-tab').forEach((b, i) => { b.className = `ws-tab whitespace-nowrap px-4 py-1.5 text-xs font-bold rounded-btn transition-colors ${i===idx?'bg-primary text-bg':'bg-input text-textMuted border border-border'}`; });
    ['wsPageInfo', 'wsPageWelcome', 'wsPageSosmed', 'wsPageSection'].forEach((id, i) => { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', i !== idx); });
}

async function fetchWebSettings() {
    try {
        const r = await callRest("web_settings?select=*"); const map = {}; r.forEach(o => map[o.key] = o.value);
        const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
        const setChk = (id, val) => { const el = document.getElementById(id); if (el) el.checked = val === 'true'; };
        setVal('wsTitle', map.site_title); setVal('wsAbout', map.about_text); setVal('wsFooter', map.footer_text); setVal('wsSearch', map.search_placeholder); setVal('wsAccent', map.accent_color);
        setChk('wsWelcomeActive', map.welcome_active); setVal('wsWTitle', map.welcome_title); setVal('wsWSub', map.welcome_subtitle); setVal('wsBtn1T', map.welcome_btn1_text); setVal('wsBtn1L', map.welcome_btn1_link); setVal('wsBtn2T', map.welcome_btn2_text); setVal('wsBtn2L', map.welcome_btn2_link);
        setVal('wsWa', map.wa_channel); setVal('wsTg', map.tg_channel); setVal('wsIg', map.ig_channel); setVal('wsWaReq', map.wa_request); setChk('wsShowCarousel', map.show_carousel);
    } catch (e) {}
}

async function saveWebSettings() {
    const updates = [
        { key: 'site_title', value: document.getElementById('wsTitle').value }, { key: 'about_text', value: document.getElementById('wsAbout').value }, { key: 'footer_text', value: document.getElementById('wsFooter').value }, { key: 'search_placeholder', value: document.getElementById('wsSearch').value }, { key: 'accent_color', value: document.getElementById('wsAccent').value },
        { key: 'welcome_active', value: document.getElementById('wsWelcomeActive').checked ? 'true' : 'false' }, { key: 'welcome_title', value: document.getElementById('wsWTitle').value }, { key: 'welcome_subtitle', value: document.getElementById('wsWSub').value }, { key: 'welcome_btn1_text', value: document.getElementById('wsBtn1T').value }, { key: 'welcome_btn1_link', value: document.getElementById('wsBtn1L').value }, { key: 'welcome_btn2_text', value: document.getElementById('wsBtn2T').value }, { key: 'welcome_btn2_link', value: document.getElementById('wsBtn2L').value },
        { key: 'wa_channel', value: document.getElementById('wsWa').value }, { key: 'tg_channel', value: document.getElementById('wsTg').value }, { key: 'ig_channel', value: document.getElementById('wsIg').value }, { key: 'wa_request', value: document.getElementById('wsWaReq').value }, { key: 'show_carousel', value: document.getElementById('wsShowCarousel').checked ? 'true' : 'false' }
    ];
    try {
        for (const u of updates) {
            const existing = await callRest(`web_settings?key=eq.${u.key}`, 'GET');
            if (existing.length > 0) await callRest(`web_settings?key=eq.${u.key}`, 'PATCH', u, true);
            else await callRest('web_settings', 'POST', u, true);
        }
        showToast("Settings tersimpan", "success");
    } catch (e) { showToast(e.message, "error"); }
}
