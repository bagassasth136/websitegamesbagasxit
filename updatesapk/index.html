<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#050506;--bg2:#0A0A0D;--card:#0E0E12;--card2:#141419;
  --border:#1C1C24;--border2:#262631;
  --txt:#F5F5F7;--txt-dim:#8E8E96;--txt-mute:#55555D;
  --accent:#A855F7;--accent2:#7C3AED;--glow:rgba(168,85,247,.35);
  --green:#10B981;--red:#EF4444;--yellow:#F59E0B;--cyan:#06B6D4;--pink:#EC4899;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;padding-bottom:40px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px}
.header{position:sticky;top:0;z-index:100;background:rgba(5,5,6,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--txt);text-decoration:none;transition:.2s;flex-shrink:0;cursor:pointer}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:16px;height:16px;stroke-width:2.5}
.logo{flex:1;display:flex;flex-direction:column;line-height:1.1;min-width:0}
.logo-txt{font-weight:900;font-size:17px;letter-spacing:.5px;background:linear-gradient(135deg,#fff 0%,#C4B5FD 60%,#67E8F9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.logo small{font-size:8px;letter-spacing:3px;font-weight:600;color:var(--txt-mute)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hero{position:relative;padding:32px 20px 26px;text-align:center;margin:16px 0 8px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#0E0E12 0%,#14102A 100%);border:1px solid var(--border2)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,var(--glow),transparent 55%),radial-gradient(circle at 80% 80%,rgba(6,182,212,.18),transparent 55%);pointer-events:none}
.hero-inner{position:relative;z-index:2}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;background:rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.4);color:var(--cyan);font-size:9px;font-weight:900;letter-spacing:1.5px;margin-bottom:14px;text-transform:uppercase}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.4}}
.hero h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,#fff 20%,var(--cyan) 60%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px;margin-bottom:8px;line-height:1.1}
.hero p{font-size:12px;color:var(--txt-dim);font-weight:500}
.search-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 14px;margin:16px 0 12px;transition:.2s}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.search-box svg{width:16px;height:16px;color:var(--txt-mute);flex-shrink:0}
.search-box input{flex:1;background:transparent;border:none;outline:none;padding:13px 0;color:var(--txt);font-size:13px;font-family:'Inter',sans-serif}
.search-box input::placeholder{color:var(--txt-mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--txt-dim);font-size:11px;font-weight:800;cursor:pointer;transition:.2s;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--glow)}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
.sec-head h2{font-size:15px;font-weight:900;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.sec-head h2 .hl{color:var(--cyan)}
.sec-head .cnt{font-size:10px;color:var(--txt-mute);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:24px}
@media(max-width:420px){.grid{grid-template-columns:1fr;gap:12px}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.3s;position:relative;display:flex;flex-direction:column;animation:cardIn .5s cubic-bezier(.16,1,.3,1) backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card:hover{border-color:var(--accent2);box-shadow:0 12px 32px rgba(0,0,0,.6)}
.card .thumb{width:100%;height:180px;background:linear-gradient(135deg,#0A0A0D,#14141C);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card .thumb .thumb-blur{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(40px) saturate(1.4) brightness(0.55);transform:scale(1.2);z-index:1}
.card .thumb .thumb-main{position:relative;z-index:2;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.card .thumb .ico-wrap{position:relative;z-index:2;width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;transition:.4s}
.card:hover .thumb .ico-wrap{transform:scale(1.08) rotate(-3deg)}
.ico-proxy{background:linear-gradient(135deg,#06B6D4,#0891B2);box-shadow:0 8px 24px rgba(6,182,212,.5)}
.ico-apkmods{background:linear-gradient(135deg,#A855F7,#7C3AED);box-shadow:0 8px 24px rgba(168,85,247,.5)}
.ico-crack{background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:0 8px 24px rgba(239,68,68,.5)}
.ico-random{background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 8px 24px rgba(245,158,11,.5)}
.ico-generator{background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 8px 24px rgba(16,185,129,.5)}
.ico-script{background:linear-gradient(135deg,#EC4899,#DB2777);box-shadow:0 8px 24px rgba(236,72,153,.5)}
.ico-default{background:linear-gradient(135deg,#64748B,#475569);box-shadow:0 8px 24px rgba(100,116,139,.5)}
.card .thumb .ico-wrap svg{width:38px;height:38px;color:#fff;stroke-width:2.2}
.card .badge-cat{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);color:var(--cyan);font-size:8px;font-weight:900;padding:4px 10px;border-radius:6px;letter-spacing:.5px;z-index:5;text-transform:uppercase}
.card .info{padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .info h3{font-size:15px;font-weight:900;line-height:1.3}
.card .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--txt-dim);font-weight:700}
.card .meta span{display:inline-flex;align-items:center;gap:4px}
.card .meta .v{color:var(--cyan);font-weight:900}
.card .meta .sz{color:var(--accent);font-weight:900}
.card .changelog{background:rgba(10,10,13,.6);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--txt-dim);line-height:1.6;margin-top:4px}
.card .changelog .lbl{color:var(--yellow);font-weight:900;font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;display:block}
.card .actions{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.card .actions a,.card .actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:10px;text-decoration:none;border:none;font-family:'Inter',sans-serif;font-weight:900;font-size:11px;letter-spacing:.5px;cursor:pointer;transition:.2s}
.card .actions .btn-dl{background:linear-gradient(135deg,#A855F7,#7C3AED);color:#fff;box-shadow:0 6px 20px var(--glow)}
.card .actions .btn-dl:active{transform:scale(.96)}
.card .actions .btn-key{background:var(--card2);border:1.5px solid var(--accent);color:var(--accent)}
.card .actions .btn-key:active{transform:scale(.96)}
.card .actions .btn-key[disabled]{opacity:.55;cursor:not-allowed;border-color:var(--border);color:var(--txt-mute)}
.card .actions svg{width:14px;height:14px;stroke-width:2.5}
.loading{text-align:center;padding:40px;color:var(--txt-mute);font-size:12px;font-weight:600;grid-column:1/-1}
.loading::after{content:'';display:block;width:30px;height:30px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;margin:16px auto 0;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:24px 16px;font-size:10px;color:var(--txt-mute);letter-spacing:.5px;font-weight:600;border-top:1px solid var(--border);margin-top:20px}
.footer a{color:var(--accent);text-decoration:none}
.footer .foot-nav{display:flex;justify-content:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.footer .foot-nav a{font-size:11px;font-weight:700;color:var(--txt-dim)}
.footer .foot-nav a:hover{color:var(--accent)}
.fab{position:fixed;bottom:20px;right:16px;z-index:90;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#25D366,#128C7E);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;box-shadow:0 10px 30px rgba(37,211,102,.5);transition:.3s}
.fab svg{width:24px;height:24px;stroke-width:2.2}
.fab:active{transform:scale(.92)}
</style>
</head>
<body>

<div class="wrap">

<script>
const SB_URL = 'https://qlzwqbbvjscfjaicbhks.supabase.co';
const SB_KEY = 'sb_publishable_DRIOqI7O90TinECl4K6FJA_l0nIaPCY';
const SB_HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

const SVG_PROXY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
const SVG_APKMODS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>';
const SVG_CRACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';
const SVG_RANDOM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="15.5" r="1.5"/><circle cx="15.5" cy="8.5" r="1.5"/><circle cx="8.5" cy="15.5" r="1.5"/><circle cx="12" cy="12" r="1.5"/></svg>';
const SVG_GENERATOR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>';
const SVG_SCRIPT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>';
const SVG_DEF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>';

const CAT_CFG = {
  'PROXY BAGASXIT': { svg: SVG_PROXY, cls: 'ico-proxy', tag: 'PROXY' },
  'APKMODS MENU': { svg: SVG_APKMODS, cls: 'ico-apkmods', tag: 'APKMODS' },
  'CRACK MOD/APP': { svg: SVG_CRACK, cls: 'ico-crack', tag: 'CRACK' },
  'RANDOM MODS': { svg: SVG_RANDOM, cls: 'ico-random', tag: 'RANDOM' },
  'APK GENERATOR KEY': { svg: SVG_GENERATOR, cls: 'ico-generator', tag: 'GENERATOR' },
  'SCRIPT FILE MODS': { svg: SVG_SCRIPT, cls: 'ico-script', tag: 'SCRIPT' }
};

let ALL_APK = [];
let FILTERED = [];
let curFilter = 'ALL';
let curSearch = '';

async function loadApkList() {
  try {
    const r = await fetch(SB_URL + '/rest/v1/_apk_updates?select=*&is_active=eq.true&order=sort_order.asc', { headers: SB_HDR });
    if (!r.ok) throw new Error('fail');
    ALL_APK = await r.json();
    renderTabs();
    applyFilters();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="loading" style="color:#EF4444">❌ Failed to load data</div>';
  }
}

function renderTabs() {
  const cats = ['ALL', ...new Set(ALL_APK.map(p => p.category))];
  const box = document.getElementById('tabs');
  box.innerHTML = cats.map(c => {
    let ico = '', label = '';
    if (c === 'ALL') {
      ico = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
      label = 'ALL';
    } else {
      const cfg = CAT_CFG[c] || { svg: SVG_DEF, tag: c };
      ico = cfg.svg;
      label = cfg.tag;
    }
    return `<div class="tab ${c === curFilter ? 'active' : ''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${ico}<span>${label}</span></div>`;
  }).join('');
}

function setFilter(cat) {
  curFilter = cat;
  renderTabs();
  applyFilters();
}

function applyFilters() {
  let list = ALL_APK;
  if (curFilter !== 'ALL') list = list.filter(p => p.category === curFilter);
  if (curSearch) list = list.filter(p => p.name.toLowerCase().includes(curSearch));
  FILTERED = list;
  renderGrid();
}

function renderGrid() {
  const box = document.getElementById('grid');
  const cnt = document.getElementById('apkCount');
  cnt.textContent = FILTERED.length + ' files';

  if (!FILTERED.length) {
    box.innerHTML = '<div class="loading">No APK available</div>';
    return;
  }

  box.innerHTML = FILTERED.map(p => {
    const cfg = CAT_CFG[p.category] || { svg: SVG_DEF, cls: 'ico-default', tag: p.category };
    const ver = p.version || 'v1.0';
    const size = p.size || '-';
    const changelog = p.changelog || '';
    const link = p.link || '#';
    const getkeyLink = p.getkey_link || '';

    const changelogHtml = changelog
      ? `<div class="changelog"><span class="lbl">Changelog</span>${changelog.replace(/\n/g, '<br>')}</div>`
      : '';

    const getkeyIsUrl = getkeyLink && (getkeyLink.startsWith('http://') || getkeyLink.startsWith('https://'));
    const getkeyLabel = getkeyIsUrl ? 'GET KEY' : getkeyLink;
    const getkeyBtn = getkeyLink
      ? (getkeyIsUrl
          ? `<a href="${getkeyLink}" class="btn-key" target="_blank">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
              GET KEY
            </a>`
          : `<button class="btn-key" disabled>${getkeyLabel}</button>`)
      : '';

    const thumbHtml = p.screenshot
      ? `<img src="${p.screenshot}" class="thumb-blur" alt=""><img src="${p.screenshot}" class="thumb-main" alt="${p.name}" onerror="this.parentNode.querySelector('.thumb-blur').style.display='none';this.style.display='none'">`
      : `<div class="ico-wrap ${cfg.cls}">${cfg.svg}</div>`;

    return `<div class="card">
      <div class="badge-cat">${cfg.tag}</div>
      <div class="thumb">${thumbHtml}</div>
      <div class="info">
        <h3>${p.name}</h3>
        <div class="meta">
          <span>📦 <span class="v">${ver}</span></span>
          <span>💾 <span class="sz">${size}</span></span>
        </div>
        ${changelogHtml}
        <div class="actions">
          <a href="${link}" class="btn-dl" target="_blank">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            DOWNLOAD
          </a>
          ${getkeyBtn}
        </div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  curSearch = e.target.value.toLowerCase().trim();
  applyFilters();
});

loadApkList();
</script>
</body>
</html>
