<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAGASXIT STORE</title>
<meta name="theme-color" content="#050506">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#050506;--bg2:#0A0A0D;--card:#0E0E12;--card2:#141419;
  --border:#1C1C24;--border2:#262631;
  --txt:#F5F5F7;--txt-dim:#8E8E96;--txt-mute:#55555D;
  --accent:#A855F7;--accent2:#7C3AED;--glow:rgba(168,85,247,.35);
  --green:#10B981;--red:#EF4444;--yellow:#F59E0B;--cyan:#06B6D4;--pink:#EC4899;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;padding-bottom:40px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px}
.header{position:sticky;top:0;z-index:100;background:rgba(5,5,6,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.back-btn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--txt);text-decoration:none;transition:.2s}
.back-btn:active{transform:scale(.92)}
.logo{flex:1;display:flex;flex-direction:column;line-height:1.1}
.logo-txt{font-weight:900;font-size:17px;letter-spacing:.5px;background:linear-gradient(135deg,#fff 0%,#C4B5FD 60%,#67E8F9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo small{font-size:8px;letter-spacing:3px;font-weight:600;color:var(--txt-mute)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hero{padding:28px 0 16px;text-align:center}
.hero h1{font-size:26px;font-weight:900;background:linear-gradient(135deg,#fff,var(--accent),#67E8F9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px;margin-bottom:6px}
.hero p{font-size:12px;color:var(--txt-dim);font-weight:500}
.hero .line{width:60px;height:3px;background:linear-gradient(90deg,var(--accent),var(--cyan));border-radius:3px;margin:12px auto 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 18px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--txt-dim);font-size:11px;font-weight:800;cursor:pointer;transition:.2s;letter-spacing:.3px}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.3s;position:relative}
.card:active{transform:scale(.97)}
.card:hover{border-color:var(--accent2);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card .thumb{width:100%;aspect-ratio:1/1;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;transition:.3s}
.card:hover .thumb{transform:scale(1.05)}
.card .thumb::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--glow),transparent 70%);opacity:.4}
.card .info{padding:12px}
.card .info h4{font-size:12px;font-weight:800;margin-bottom:6px;line-height:1.3;min-height:32px}
.card .info .price{font-size:15px;font-weight:900;color:var(--accent);letter-spacing:.3px}
.card .info .price.nego{color:var(--yellow);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.card .cat-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);color:var(--accent);font-size:8px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.5px;z-index:2}
.loading{text-align:center;padding:40px;color:var(--txt-mute);font-size:12px;font-weight:600;grid-column:1/-1}
.loading::after{content:'';display:block;width:30px;height:30px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;margin:16px auto 0;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.3s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:1px solid var(--accent2);border-radius:20px;padding:24px;max-width:380px;width:100%;position:relative;transform:scale(.85);transition:transform .3s cubic-bezier(.16,1,.3,1);box-shadow:0 30px 60px rgba(0,0,0,.8),0 0 60px var(--glow);max-height:90vh;overflow-y:auto}
.modal-bg.show .modal{transform:scale(1)}
.modal-x{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--txt-mute);font-size:20px;cursor:pointer;font-weight:700}
.modal .m-emoji{font-size:52px;text-align:center;margin-bottom:10px}
.modal .m-cat{text-align:center;font-size:9px;font-weight:800;color:var(--cyan);letter-spacing:1.5px;margin-bottom:6px;text-transform:uppercase}
.modal h2{font-size:18px;font-weight:900;text-align:center;margin-bottom:14px;color:var(--txt)}
.modal .m-price{text-align:center;font-size:26px;font-weight:900;color:var(--accent);margin-bottom:18px;letter-spacing:.5px}
.modal .m-price.nego{font-size:14px;color:var(--yellow);letter-spacing:1.5px;text-transform:uppercase}
.modal .m-desc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;color:var(--txt-dim);line-height:1.6;margin-bottom:16px}
.modal .m-feat{list-style:none;margin-bottom:18px}
.modal .m-feat li{font-size:12px;color:var(--txt-dim);padding:6px 0;display:flex;align-items:center;gap:8px}
.modal .m-feat li::before{content:'✓';color:var(--green);font-weight:900}
.modal .m-btn{display:block;width:100%;padding:15px;border-radius:12px;text-align:center;text-decoration:none;font-weight:900;font-size:13px;letter-spacing:.5px;transition:.2s;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;box-shadow:0 6px 20px rgba(37,211,102,.3)}
.modal .m-btn:active{transform:scale(.97)}
.modal .m-tg{display:block;width:100%;padding:12px;border-radius:12px;text-align:center;text-decoration:none;font-weight:800;font-size:12px;margin-top:8px;background:var(--card2);border:1px solid var(--border);color:var(--txt);letter-spacing:.3px}
.footer{text-align:center;padding:20px 16px;font-size:10px;color:var(--txt-mute);letter-spacing:.5px;font-weight:600;border-top:1px solid var(--border);margin-top:20px}
.footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="back-btn">←</a>
    <div class="logo">
      <div class="logo-txt">BAGASXIT STORE</div>
      <small>PREMIUM DIGITAL</small>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h1>✨ BAGASXIT STORE</h1>
    <p>Premium digital products & services</p>
    <div class="line"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid">
    <div class="loading">Memuat produk</div>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <button class="modal-x" onclick="closeModal()">✕</button>
    <div class="m-emoji" id="mEmoji">📦</div>
    <div class="m-cat" id="mCat">CATEGORY</div>
    <h2 id="mName">Produk</h2>
    <div class="m-price" id="mPrice">Rp 0</div>
    <div class="m-desc" id="mDesc">Deskripsi produk.</div>
    <ul class="m-feat" id="mFeat"></ul>
    <a href="#" class="m-btn" id="mWa" target="_blank">💬 ORDER VIA WHATSAPP</a>
    <a href="https://t.me/BagasXIT" class="m-tg" target="_blank">✈️ Tanya via Telegram</a>
  </div>
</div>

<footer class="footer">
  © 2026 <a href="/">BAGASXIT</a> · Premium Store
</footer>
<script>
const SB_URL = 'https://qlzwqbbvjscfjaicbhks.supabase.co';
const SB_KEY = 'sb_publishable_DRIOqI7O90TinECl4K6FJA_l0nIaPCY';
const SB_HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
const WA_ADMIN = '6283182456929';

const CAT_EMOJI = { 'KEY': '🔑', 'JASA PASANG CLOUD': '☁️', 'HTML/WEBSITE/SCRIPT': '💻' };
const CAT_TAG = { 'KEY': 'KEY', 'JASA PASANG CLOUD': 'CLOUD', 'HTML/WEBSITE/SCRIPT': 'HTML/SCRIPT' };

let ALL_PRODUCTS = [];
let curFilter = 'ALL';
let curProduct = null;

async function loadProducts() {
  try {
    const r = await fetch(SB_URL + '/rest/v1/_store_products?select=*&is_active=eq.true&order=sort_order.asc', { headers: SB_HDR });
    if (!r.ok) throw new Error('fetch fail');
    ALL_PRODUCTS = await r.json();
    renderTabs();
    renderGrid();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="loading" style="color:#EF4444">❌ Gagal memuat produk</div>';
  }
}

function renderTabs() {
  const cats = ['ALL', ...new Set(ALL_PRODUCTS.map(p => p.category))];
  const box = document.getElementById('tabs');
  box.innerHTML = cats.map(c => {
    const label = c === 'ALL' ? '🔥 SEMUA' : (CAT_EMOJI[c] || '📦') + ' ' + (CAT_TAG[c] || c);
    return `<div class="tab ${c === curFilter ? 'active' : ''}" onclick="setFilter('${c.replace(/'/g, "\\'")}')">${label}</div>`;
  }).join('');
}

function setFilter(cat) {
  curFilter = cat;
  renderTabs();
  renderGrid();
}

function renderGrid() {
  const box = document.getElementById('grid');
  let list = ALL_PRODUCTS;
  if (curFilter !== 'ALL') list = list.filter(p => p.category === curFilter);

  if (!list.length) {
    box.innerHTML = '<div class="loading">Belum ada produk</div>';
    return;
  }

  box.innerHTML = list.map(p => {
    const isNego = !p.price || p.price === 0;
    const priceHtml = isNego
      ? '<div class="price nego">Hubungi Admin</div>'
      : '<div class="price">' + p.price_text + '</div>';
    const emoji = p.emoji || CAT_EMOJI[p.category] || '📦';
    const tag = CAT_TAG[p.category] || p.category;
    return `<div class="card" onclick="showProduct(${p.id})">
      <div class="cat-tag">${tag}</div>
      <div class="thumb">${emoji}</div>
      <div class="info">
        <h4>${p.name}</h4>
        ${priceHtml}
      </div>
    </div>`;
  }).join('');
}

function showProduct(id) {
  const p = ALL_PRODUCTS.find(x => x.id === id);
  if (!p) return;
  curProduct = p;

  const isNego = !p.price || p.price === 0;
  document.getElementById('mEmoji').textContent = p.emoji || CAT_EMOJI[p.category] || '📦';
  document.getElementById('mCat').textContent = CAT_TAG[p.category] || p.category;
  document.getElementById('mName').textContent = p.name;
  const priceEl = document.getElementById('mPrice');
  priceEl.textContent = isNego ? 'Hubungi Admin' : p.price_text;
  priceEl.className = isNego ? 'm-price nego' : 'm-price';
  document.getElementById('mDesc').textContent = p.description || 'Produk premium BAGASXIT.';

  // Features per kategori
  let feats = [];
  if (p.category === 'KEY') {
    feats = ['Single device', 'Support semua mod BAGASXIT', 'Aktivasi via APK', 'Auto-replace expired'];
  } else if (p.category === 'JASA PASANG CLOUD') {
    feats = ['Pasang APK mod ke cloud', 'Support semua cloud phone', 'Garansi sampai jalan', 'Setup cepat'];
  } else {
    feats = ['File source included', 'Dokumentasi lengkap', 'Support setup', 'Bisa custom'];
  }
  document.getElementById('mFeat').innerHTML = feats.map(f => `<li>${f}</li>`).join('');

  const waMsg = encodeURIComponent(
    '🛒 *ORDER BAGASXIT STORE*\n\n' +
    '📦 Produk: ' + p.name + '\n' +
    '🏷 Kategori: ' + p.category + '\n' +
    '💰 Harga: ' + (isNego ? 'Nego' : p.price_text) + '\n\n' +
    'Mohon info lebih lanjut 🙏'
  );
  document.getElementById('mWa').href = 'https://wa.me/' + WA_ADMIN + '?text=' + waMsg;

  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

loadProducts();
</script>
</body>
</html>
